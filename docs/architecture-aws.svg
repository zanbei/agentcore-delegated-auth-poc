<text x="292" y="712" font-size="11.5" font-weight="400" fill="#1d2939" text-anchor="start">用户在浏览器登录 Keycloak(经 CloudFront):PoC 1 取得用户令牌;PoC 2 一次性登录并同意</text>
<circle cx="274" cy="729" r="8" fill="#ED7100"/>
<text x="274" y="732.5" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="292" y="733" font-size="11.5" font-weight="400" fill="#1d2939" text-anchor="start">Agent 客户端带用户令牌调用 Gateway(tools/call,入站要求 aud=agent-app)</text>
