<text x="292" y="754" font-size="11.5" font-weight="400" fill="#1d2939" text-anchor="start">Identity 向 Keycloak 取令牌:OBO 交换(PoC 1,粗橙线)/ 授权码回调与刷新(PoC 2)</text>
<circle cx="274" cy="771" r="8" fill="#ED7100"/>
<text x="274" y="774.5" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="292" y="775" font-size="11.5" font-weight="400" fill="#1d2939" text-anchor="start">调度器角色用 ForUserId(任务里的用户 sub)向 Identity 取令牌(PoC 2,用户不在场)</text>
<circle cx="274" cy="792" r="8" fill="#ED7100"/>
<text x="274" y="795.5" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="292" y="796" font-size="11.5" font-weight="400" fill="#1d2939" text-anchor="start">调度器带该用户令牌 lambda:Invoke 下游,下游校验 iss / aud / 签名后只返回该用户数据</text>
